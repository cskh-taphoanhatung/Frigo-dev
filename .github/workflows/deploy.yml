# Required production Environment reviewers are operator-managed, never configured by this workflow.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: production
      ref:
        description: Full release SHA or refs/tags/v* tag already contained in main (not a branch)
        type: string
        required: true
      hardened_sha:
        description: Exact final hardening SHA approved by the release owner; release must contain it
        type: string
        required: true
      confirm_production:
        description: Confirm this is an intentional production deployment
        type: boolean
        default: false
      recipe_catalog_mode:
        description: Recipe catalog authority mode (bounded canary only; full D1 is intentionally unavailable)
        type: choice
        options: [static, shadow, canary]
        default: static
      recipe_catalog_d1_canary_percent:
        description: Bounded D1 canary percentage (0 for static/shadow; 1/2/5 for canary)
        type: choice
        options: ['0', '1', '2', '5']
        default: '0'

permissions:
  contents: read
  actions: read

concurrency:
  group: frigo-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  release:
    # Only the reviewed workflow on main can authorize an immutable release.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       (inputs.environment == 'staging' || inputs.confirm_production == true)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.gate.outputs.deploy_sha }}
      recipe_catalog_mode: ${{ steps.gate.outputs.recipe_catalog_mode }}
      recipe_catalog_d1_canary_percent: ${{ steps.gate.outputs.recipe_catalog_d1_canary_percent }}
      recipe_catalog_cutover_enabled: ${{ steps.gate.outputs.recipe_catalog_cutover_enabled }}
    steps:
      - name: Checkout trusted main release policy and full ancestry
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require main ancestry, approved hardening, and exact-SHA hosted CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          HARDENED_SHA: ${{ inputs.hardened_sha }}
          RELEASE_ENVIRONMENT: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
          RECIPE_CATALOG_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.recipe_catalog_mode || 'static' }}
          RECIPE_CATALOG_D1_CANARY_PERCENT: ${{ github.event_name == 'workflow_dispatch' && inputs.recipe_catalog_d1_canary_percent || '0' }}
        run: node scripts/release-check.mjs gate

      - name: Save immutable candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

  staging:
    needs: release
    if: github.event_name == 'workflow_run' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify staging configuration exists
        run: |
          if [ ! -f wrangler.staging.jsonc ]; then
            echo "::notice::Staging is not provisioned; no deployment attempted."
            echo "STAGING_UNCONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Build
        if: env.STAGING_UNCONFIGURED != 'true'
        env:
          GIT_COMMIT: ${{ needs.release.outputs.deploy_sha }}
        run: pnpm build

      - name: Recheck exact-head CI after environment approval
        if: env.STAGING_UNCONFIGURED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs recheck

      - name: Deploy to Cloudflare staging
        if: env.STAGING_UNCONFIGURED != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.staging.jsonc --var GIT_COMMIT:${{ needs.release.outputs.deploy_sha }} --var RECIPE_CATALOG_MODE:${{ needs.release.outputs.recipe_catalog_mode }} --var RECIPE_CATALOG_D1_CANARY_PERCENT:${{ needs.release.outputs.recipe_catalog_d1_canary_percent }} --var RECIPE_CATALOG_CUTOVER_ENABLED:${{ needs.release.outputs.recipe_catalog_cutover_enabled }}

      # Exact-SHA proof polls readiness within a bounded deadline: the edge may briefly serve the
      # previous Worker version after upload. Only that propagation case is retried; nothing redeploys.
      - name: Staging exact SHA receipt and post-deploy smoke
        if: env.STAGING_UNCONFIGURED != 'true' && vars.STAGING_URL != ''
        env:
          APP_SMOKE_URL: ${{ vars.STAGING_URL }}
        run: |
          node scripts/wait-for-deployed-release.mjs release-manifest.json
          bash scripts/post-deploy-smoke.sh "$APP_SMOKE_URL" "${{ needs.release.outputs.deploy_sha }}"

      - name: Save staging receipt after exact-SHA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          retention-days: 90

  production:
    needs: release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' && inputs.confirm_production == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout pinned approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Require explicit production smoke origin
        env:
          APP_SMOKE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          node --input-type=module -e '
            const value = process.env.APP_SMOKE_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value) throw new Error("PRODUCTION_URL must be an exact HTTPS origin");
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local gates
        env:
          GIT_COMMIT: ${{ needs.release.outputs.deploy_sha }}
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:migrations
          pnpm build

      - name: Recheck exact-head CI after approval and local gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs recheck

      # SELECT-only; missing/unknown migrations block deployment, never auto-apply.
      - name: Pre-deploy schema gate and migration ledger receipt (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash scripts/d1-schema-gate.sh remote
          pnpm wrangler d1 execute frigo-db --remote --yes --command "SELECT name FROM d1_migrations ORDER BY name" --json > migration-ledger.json
          node scripts/release-check.mjs schema release-manifest.json migration-ledger.json

      - name: Deploy to Cloudflare production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var GIT_COMMIT:${{ needs.release.outputs.deploy_sha }} --var RECIPE_CATALOG_MODE:${{ needs.release.outputs.recipe_catalog_mode }} --var RECIPE_CATALOG_D1_CANARY_PERCENT:${{ needs.release.outputs.recipe_catalog_d1_canary_percent }} --var RECIPE_CATALOG_CUTOVER_ENABLED:${{ needs.release.outputs.recipe_catalog_cutover_enabled }}

      - name: Production exact SHA receipt and post-deploy smoke
        env:
          APP_SMOKE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          node scripts/wait-for-deployed-release.mjs release-manifest.json
          bash scripts/post-deploy-smoke.sh "$APP_SMOKE_URL" "${{ needs.release.outputs.deploy_sha }}"

      - name: Save production receipt even on failure (inspect deployed field)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          retention-days: 90
